instance:
  no_inits: 30
  seed_value: 10
  lr: 0.001
  min_delta: 1e-7
  patience: 200
  optimizer: 'adam'        # adam, nadam, adamax, adamw, rmsprop, adagrad, adadelta, sgd, sgd_momentum, nesterov
  opt_momentum: 0.9        # sgd_momentum / nesterov / rmsprop
  opt_weight_decay: 0.004  # adamw
  verbose: 0
  dropout: 0
  n_process: 55
  model_selection: 'IC' #  'Holdout', 'IC'
  formulation : 'global'          # Model formulation, "global", "regional" or "income"
  timeout_per_node: 100000
  reduce_lr_on_plateau: true   # attach a Keras ReduceLROnPlateau callback to training
  lr_reduce_factor: 0.3         # multiply lr by this when monitored loss plateaus
  lr_reduce_patience: 100        # epochs with no improvement before each reduction
  lr_min: 1.0e-7                # floor for the learning rate
  within_projection: true
  use_diagnostics: true
  target_mode: 'growth'   # 'growth' (model GrowthWDI) or 'levels' (model log GDP per capita)
  input_vars:
    - temp
    - precip
  activation: 'swish' #
  country_trends: True
  quadratic_trends: True   # only used when country_trends is True; set False for linear-only trends
  group_trends_by_country: False   # 'ee' data only: estimate one trend per country instead of per admin-1 unit (fid)
  dynamic_model: False
  data_source: 'wb'   # "ee" or "wb"
  ram: 500
  data_end: 2024
  nodes_list:
    - (2,)
    - (4,)
    - (8,)
    - (16,)
    - (32,)
    - (48,)
    - (64,)
    - (2,2,)
    - (4,2,)
    - (4,4,)
    - (8,2,)
    - (8,4,)
    - (8,8,)
    - (16,2,)
    - (16,8,)
    - (16,16,)
    - (32,2,)
    - (32,4,)
    - (32,8,)
    - (32,16,)
    - (32,32,)
    - (2,2,2,)
    - (4,2,2,)
    - (4,4,2,)
    - (4,4,4,)
    - (8,2,2,)
    - (8,4,4,)
    - (8,8,2,)
    - (8,8,4,)
    - (8,8,8,)
    - (16,2,2,)
    - (16,4,2,)
    - (16,4,4,)
    - (16,8,2,)
    - (16,8,4,)
    - (16,8,8,)
    - (16,16,2,)
    - (16,16,4,)
    - (16,16,8,)
    - (16,16,16,)
    - (32,2,2,)
    - (32,4,2,)
    - (32,4,4,)
    - (32,8,2,)
    - (32,8,4,)
    - (32,8,8,)
    - (32,16,2,)
    - (32,16,4,)
    - (32,16,8,)
    - (32,16,16,)
    - (32,32,2,)
    - (32,32,4,)
    - (32,32,8,)
    - (32,32,16,)
    - (32,32,32,)
  bootstrap:
    n_boot: 200
    n_process: null          # null means reuse instance.n_process
    n_inits: 5               # random initializations per bootstrap/node fit
    top_k: 10                # top AIC-ranked architectures from run_dir
    run_dir: runs/estimation/2026-05-28_11-22-20_global_IC_country_trends         # finished estimation run with results.npy
    nodes: null              # optional explicit list, e.g. ["(2,)", "(4,)"]
    node: null               # optional single architecture, e.g. "(2,)"
    report_every: 25
